<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">DeskCheck PC diagnostic logo</title>
  <desc id="desc">A mint DC monogram inside a glass monitor tile with a diagnostic pulse.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#263E5B"/><stop offset="1" stop-color="#101A2D"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B5F7D8"/><stop offset="1" stop-color="#63E6BE"/></linearGradient>
  </defs>
  <rect x="12" y="12" width="488" height="488" rx="126" fill="url(#tile)"/>
  <path d="M126 35h260c52 0 91 39 91 91v28c-113-44-251-67-372-54V126c0-52 39-91 91-91Z" fill="#fff" opacity=".055"/>
  <rect x="28" y="28" width="456" height="456" rx="112" fill="none" stroke="#9FB7CE" stroke-opacity=".42" stroke-width="3"/>
  <!-- monitor silhouette: a diagnostic device cue that stays legible at icon size -->
  <rect x="76" y="86" width="360" height="238" rx="28" fill="#0B1425" stroke="#7F9AB5" stroke-opacity=".7" stroke-width="8"/>
  <rect x="95" y="105" width="322" height="199" rx="16" fill="#14243A" stroke="#63E6BE" stroke-opacity=".16" stroke-width="3"/>
  <path d="M211 365h90M232 324v41M280 324v41M188 383h136" stroke="#9FB7CE" stroke-opacity=".75" stroke-width="10" stroke-linecap="round"/>
  <!-- DC monogram -->
  <path d="M128 142h55c49 0 79 35 79 63s-30 63-79 63h-55V142Zm46 38v50h7c22 0 35-9 35-25s-13-25-35-25h-7Z" fill="url(#mint)"/>
  <path d="M369 163c-11-15-25-22-44-22-33 0-54 24-54 64s21 64 54 64c19 0 33-7 44-22l-31-20c-4 6-8 9-15 9-11 0-18-11-18-31s7-31 18-31c7 0 11 3 15 9l31-20Z" fill="url(#mint)"/>
  <!-- system check pulse -->
  <path d="M116 279h35l13-14 20 15 24-25 20 13 25-31 23 21 20-14 22 14 23-17 22 12" fill="none" stroke="#B5F7D8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="399" cy="268" r="8" fill="#FFCA6B"/><circle cx="399" cy="268" r="16" fill="none" stroke="#FFCA6B" stroke-opacity=".24" stroke-width="3"/>
</svg>
