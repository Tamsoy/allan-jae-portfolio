<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SheetClean CSV cleaning logo</title>
  <desc id="desc">A glass spreadsheet document with a CSV label, structured data rows, a cleaning sweep, spark and check badge.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B4770"/>
      <stop offset="1" stop-color="#0D1729"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FBFF"/>
      <stop offset="1" stop-color="#C7E0EC"/>
    </linearGradient>
    <linearGradient id="csv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FE8C4"/>
      <stop offset="1" stop-color="#2CC7AA"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020817" flood-opacity=".42"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="132" fill="url(#tile)"/>
  <rect x="32" y="32" width="448" height="448" rx="116" fill="none" stroke="#A8C2DA" stroke-opacity=".36" stroke-width="3"/>
  <path d="M58 148C126 86 221 72 330 107c50 16 83 38 111 73V70H58z" fill="#fff" opacity=".055"/>

  <g filter="url(#shadow)">
    <rect x="112" y="90" width="288" height="336" rx="30" fill="url(#paper)"/>
    <path d="M340 90v72h60" fill="#B4D0DD"/>
    <path d="M340 90v48c0 14 10 24 24 24h36" fill="none" stroke="#8FB3C4" stroke-width="4"/>
  </g>

  <rect x="139" y="120" width="92" height="42" rx="14" fill="url(#csv)"/>
  <text x="185" y="148" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="2" fill="#06251F">CSV</text>

  <rect x="139" y="187" width="234" height="137" rx="14" fill="#EAF5F8" stroke="#8FB3C4" stroke-width="3"/>
  <path d="M139 221h234M139 255h234M139 289h234M195 187v137M252 187v137M310 187v137" stroke="#9DBBC7" stroke-width="3"/>
  <rect x="146" y="194" width="42" height="20" rx="7" fill="#4E77D2" opacity=".85"/>
  <rect x="202" y="228" width="42" height="20" rx="7" fill="#F0B45D" opacity=".92"/>
  <rect x="317" y="262" width="42" height="20" rx="7" fill="#F07A82" opacity=".9"/>
  <rect x="259" y="296" width="42" height="20" rx="7" fill="#5DD8BB" opacity=".95"/>
  <circle cx="163" cy="237" r="5" fill="#4E77D2"/>
  <circle cx="220" cy="271" r="5" fill="#4E77D2"/>
  <circle cx="278" cy="305" r="5" fill="#4E77D2"/>

  <path d="M102 370c38 33 91 48 151 41 54-6 100-32 135-76" fill="none" stroke="#6FE8C4" stroke-width="16" stroke-linecap="round" opacity=".22" filter="url(#soft)"/>
  <path d="M102 370c38 33 91 48 151 41 54-6 100-32 135-76" fill="none" stroke="#6FE8C4" stroke-width="9" stroke-linecap="round"/>
  <path d="M375 315l12 29 29 12-29 12-12 29-12-29-29-12 29-12z" fill="#F4D36B" stroke="#FFF3B2" stroke-width="3"/>

  <circle cx="378" cy="380" r="45" fill="#0C2633" stroke="#0A1725" stroke-width="8"/>
  <circle cx="378" cy="380" r="38" fill="#B8F27D"/>
  <path d="M357 380l14 14 30-32" fill="none" stroke="#123521" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
